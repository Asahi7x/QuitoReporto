name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar API
        run: dotnet build API/QuitoReporto.Api -c Release
      - name: Pruebas xUnit
        run: dotnet test TESTS/QuitoReporto.Api.Tests -c Release --logger "console;verbosity=normal"

  app-android:
    name: App (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Instalar carga de trabajo de MAUI para Android
        run: dotnet workload install maui-android
      - name: Compilar app
        run: dotnet build APP/QuitoReporto.App -f net10.0-android -c Release
