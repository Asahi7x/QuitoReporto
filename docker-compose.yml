# Base de datos PostgreSQL para desarrollo local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: quitoreporto-db
    environment:
      POSTGRES_DB: quitoreporto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - quitoreporto-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quitoreporto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quitoreporto-datos:
